[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ratheesh Ramadasan", email = "ratheesh.ramadasan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
