version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: architectiq-postgres
    environment:
      POSTGRES_DB: architectiq_test
      POSTGRES_USER: architectiq
      POSTGRES_PASSWORD: "Mad@7878"
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: architectiq-redis
    ports:
      - "6380:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: architectiq-api
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://architectiq:Mad%407878@postgres:5432/architectiq_test
      REDIS_URL: redis://redis:6379/0
      APP_DATABASE_URL: postgresql+psycopg://architectiq_app:Gmd19O4-j7F9cBrAQhzJ-IglPdXIGiSUd_eYcPS9xtqojgmZ@postgres:5432/architectiq_test
      IAM_DATABASE_URL: postgresql+psycopg://architectiq_iam_login:wITaFsh0sbUDL4UwlU8G6dVLFBbyKfF57LInULvs4wmwJhYw1KztWuXQMZZuMzA0@postgres:5432/architectiq_test
      AUDIT_DATABASE_URL: postgresql+psycopg://architectiq_audit_writer:Mad%407878@postgres:5432/architectiq_test
      NATIVE_JWT_SECRET: XrMxVsb414/3Pr3YxHz/JmCumkY3HsISj9VbLF6s7ejz/4Cni6WUjDN8qzAFWPKi
    ports:
      - "8000:8000"

  web-studio:
    build:
      context: ./apps/web-studio
      dockerfile: Dockerfile
    container_name: architectiq-web-studio
    depends_on:
      - api
    ports:
      - "8080:80"
